# Freeze exact model identifiers and the date of the run before starting (reported in Methods).
run_date: "YYYY-MM-DD"
models:
  - name: gpt          # OpenAI
    provider: openai
    model: gpt-4o
  - name: claude       # Anthropic (uses ANTHROPIC_API_KEY)
    provider: anthropic
    model: claude-sonnet-4-5
  - name: gemini       # Google via OpenAI-compatible endpoint
    provider: openai
    model: gemini-2.5-pro
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    key_env: GEMINI_API_KEY
  - name: deepseek
    provider: openai
    model: deepseek-chat
    base_url: https://api.deepseek.com
    key_env: DEEPSEEK_API_KEY
  - name: qwen
    provider: openai
    model: qwen-plus
    base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    key_env: DASHSCOPE_API_KEY
